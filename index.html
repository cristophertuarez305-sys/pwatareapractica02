<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
            margin-top: 50px;
            padding: 0 15px;
        }

        h2 {
            color: #333;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .carousel-slide {
            display: flex;
            transition: transform 0.4s ease-in-out;
            height: 100%;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 24px;
            border-radius: 5px;
            user-select: none;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        @media (max-width: 480px) {
            body { margin-top: 20px; }
            .btn { padding: 10px 14px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <h2>Carrusel de imágenes</h2>

    <div class="carousel-container">
        <div class="carousel-slide" id="carouselSlide">
            <img src="img/imagen1.jpg" alt="Imagen 1">
            <img src="img/imagen2.webp" alt="Imagen 2">
            <img src="img/imagen3.jpg" alt="Imagen 3">
            <img src="img/imagen4.jpg" alt="Imagen 4">
            <img src="img/imagen5.webp" alt="Imagen 5">
        </div>

        <button class="btn btn-prev" id="prevBtn" aria-label="Imagen anterior">&#10094;</button>
        <button class="btn btn-next" id="nextBtn" aria-label="Imagen siguiente">&#10095;</button>
    </div>

    <script>
        const slide = document.getElementById('carouselSlide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        const totalImages = slide.children.length;
        let currentIndex = 0;

        function updateCarousel() {
            const offset = -currentIndex * 100;
            slide.style.transform = `translateX(${offset}%)`;
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < totalImages - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateCarousel();
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = totalImages - 1;
            }
            updateCarousel();
        });
    </script>

</body>
</html>
